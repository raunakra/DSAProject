<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Interview Prep</title>
    
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --bg-tertiary: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #27272a;
            --sidebar-width: 280px;
            --header-height: 56px;
        }
        
        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        /* Layout */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 1rem;
            flex-shrink: 0;
        }
        
        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.25rem;
        }
        
        .logo {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .logo-icon {
            color: var(--accent);
        }
        
        .header-spacer {
            flex: 1;
        }
        
        .github-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            transition: all 0.15s;
        }
        
        .github-link:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }
        
        /* Main Content */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }
        
        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .sidebar-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        /* Topic */
        .topic {
            margin-bottom: 0.25rem;
        }
        
        .topic-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: none;
            border: none;
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }
        
        .topic-btn:hover {
            background: var(--bg-tertiary);
        }
        
        .topic-icon {
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }
        
        .topic-name {
            flex: 1;
        }
        
        .topic-chevron {
            color: var(--text-muted);
            font-size: 0.625rem;
            transition: transform 0.2s;
        }
        
        .topic.open .topic-chevron {
            transform: rotate(90deg);
        }
        
        .topic-files {
            display: none;
            padding: 0.25rem 0 0.25rem 1.75rem;
        }
        
        .topic.open .topic-files {
            display: block;
        }
        
        .file-btn {
            width: 100%;
            display: block;
            padding: 0.375rem 0.75rem;
            background: none;
            border: none;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .file-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }
        
        .file-btn.active {
            color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }
        
        /* Content Area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 0.9375rem;
        }
        
        /* Code View */
        .code-view {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        
        .code-view.visible {
            display: flex;
        }
        
        .code-toolbar {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            gap: 0.75rem;
        }
        
        .file-path {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }
        
        .file-path span {
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .toolbar-spacer {
            flex: 1;
        }
        
        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.375rem 0.625rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }
        
        .toolbar-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }
        
        .toolbar-btn.copied {
            color: #22c55e;
            border-color: #22c55e;
        }
        
        .code-wrapper {
            flex: 1;
            overflow: auto;
            padding: 1rem;
        }
        
        .code-wrapper::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        .code-wrapper::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
        .code-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        .code-wrapper pre {
            margin: 0;
            border-radius: 8px;
            background: var(--bg-secondary) !important;
        }
        
        .code-wrapper code {
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.875rem !important;
            line-height: 1.6 !important;
        }
        
        /* Loading */
        .loading {
            flex: 1;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .loading.visible {
            display: flex;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Footer */
        .footer {
            padding: 0.75rem 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
        }
        
        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        
        .footer a:hover {
            color: var(--text-primary);
        }
        
        /* Mobile */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 40;
        }
        
        .overlay.visible {
            display: block;
        }
        
        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }
            
            .sidebar {
                position: fixed;
                top: var(--header-height);
                left: 0;
                bottom: 0;
                z-index: 50;
                transform: translateX(-100%);
                transition: transform 0.2s ease;
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .github-link span {
                display: none;
            }
        }
        
        /* Prism overrides */
        .line-numbers .line-numbers-rows {
            border-right: 1px solid var(--border) !important;
        }
        
        .line-numbers-rows > span:before {
            color: var(--text-muted) !important;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="menu-btn" id="menuBtn">☰</button>
            <div class="logo">
                <span class="logo-icon">◆</span>
                <span>DSA Interview Prep</span>
            </div>
            <div class="header-spacer"></div>
            <a href="https://github.com/raunakra/DSAProject" target="_blank" class="github-link">
                <span>GitHub</span> ↗
            </a>
        </header>
        
        <!-- Overlay -->
        <div class="overlay" id="overlay"></div>
        
        <!-- Main -->
        <div class="main">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <nav class="sidebar-content" id="nav"></nav>
            </aside>
            
            <!-- Content -->
            <main class="content">
                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📂</div>
                    <p class="empty-text">Select a file from the sidebar</p>
                </div>
                
                <!-- Loading -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
                
                <!-- Code View -->
                <div class="code-view" id="codeView">
                    <div class="code-toolbar">
                        <div class="file-path">
                            <span id="fileName">file.cpp</span>
                        </div>
                        <div class="toolbar-spacer"></div>
                        <button class="toolbar-btn" id="copyBtn">📋 Copy</button>
                        <a href="#" class="toolbar-btn" id="ghBtn" target="_blank">↗ View on GitHub</a>
                    </div>
                    <div class="code-wrapper">
                        <pre class="line-numbers"><code class="language-cpp" id="code"></code></pre>
                    </div>
                </div>
            </main>
        </div>
        
        <!-- Footer -->
        <footer class="footer">
            <a href="https://github.com/raunakra/DSAProject">DSAProject</a> · 110+ Interview Problems · C++17
        </footer>
    </div>
    
    <!-- Prism.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    
    <script>
        const topics = [
            { id: 1, name: "Arrays & Strings", icon: "📊", folder: "1. Arrays_Strings", files: [
                "Two_Pointers.cpp", "Sliding_Window.cpp", "Prefix_Sum.cpp", "String_Manipulation.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 2, name: "Linked Lists", icon: "🔗", folder: "2. Linked_Lists", files: [
                "Reversal.cpp", "Fast_Slow_Pointers.cpp", "Dummy_Node.cpp", "Cycle_Detection.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 3, name: "Stacks & Queues", icon: "📚", folder: "3. Stacks_Queues", files: [
                "Monotonic_Stack.cpp", "Expression_Evaluation.cpp", "Queue_BFS.cpp", "Deque_Sliding_Window.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 4, name: "Trees", icon: "🌳", folder: "4. Trees", files: [
                "Traversals.cpp", "Recursion.cpp", "Properties.cpp", "LCA.cpp", "Diameter.cpp", "Construction.cpp", "Morris_Inorder.cpp", "Boundary_Traversal.cpp", "Left_Right_View.cpp", "Top_View.cpp", "Bottom_View.cpp", "Vertical_Order_Traversal.cpp", "Maximum_Width.cpp", "Children_Sum_Property.cpp", "Time_To_Burn_Tree.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 5, name: "Binary Search Trees", icon: "🔍", folder: "5. Binary_Search_Trees", files: [
                "Validation.cpp", "Operations.cpp", "Successor_Predecessor.cpp", "BST_to_Sorted_Array.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 6, name: "Heaps & Priority Queues", icon: "⬆️", folder: "6. Heaps_Priority_Queue", files: [
                "Top_K.cpp", "Merge_K_Sorted.cpp", "Meeting_Rooms.cpp", "Running_Median.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 7, name: "Graphs", icon: "🕸️", folder: "7. Graphs", files: [
                "BFS_DFS.cpp", "Grid_BFS.cpp", "Grid_DFS.cpp", "Cycle_Detection.cpp", "Topological_Sort.cpp", "Kosaraju_SCC.cpp", "Word_Ladder.cpp", "Dijkstra.cpp", "Union_Find.cpp", "MST_Kruskal.cpp", "Rotten_Oranges.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 8, name: "Dynamic Programming", icon: "🧩", folder: "8. Dynamic_Programming", files: [
                "1D_DP.cpp", "2D_DP.cpp", "Knapsack.cpp", "LCS_LIS.cpp", "String_DP.cpp", "DP_On_Trees.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 9, name: "Binary Search", icon: "🎯", folder: "9. Binary_Search", files: [
                "Standard_BS.cpp", "Rotated_Array.cpp", "BS_on_Answer.cpp", "Peak_Element.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 10, name: "Backtracking", icon: "🔄", folder: "10. Backtracking", files: [
                "Subsets_Permutations.cpp", "N_Queens.cpp", "Palindrome_Partitioning.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 11, name: "Bit Manipulation", icon: "💻", folder: "11. Bit_Manipulation", files: [
                "Basic_Operations.cpp", "Tricks.cpp", "Single_Number.cpp", "Amazon_Salesforce_Questions.cpp"
            ]}
        ];
        
        const GITHUB_RAW = "https://raw.githubusercontent.com/raunakra/DSAProject/main";
        const GITHUB_BLOB = "https://github.com/raunakra/DSAProject/blob/main";
        
        const nav = document.getElementById('nav');
        const emptyState = document.getElementById('emptyState');
        const loading = document.getElementById('loading');
        const codeView = document.getElementById('codeView');
        const code = document.getElementById('code');
        const fileName = document.getElementById('fileName');
        const copyBtn = document.getElementById('copyBtn');
        const ghBtn = document.getElementById('ghBtn');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        
        let currentCode = '';
        let activeBtn = null;
        
        // Build navigation
        function buildNav() {
            nav.innerHTML = topics.map(t => `
                <div class="topic" data-id="${t.id}">
                    <button class="topic-btn" onclick="toggleTopic(${t.id})">
                        <span class="topic-icon">${t.icon}</span>
                        <span class="topic-name">${t.name}</span>
                        <span class="topic-chevron">▶</span>
                    </button>
                    <div class="topic-files">
                        ${t.files.map(f => `
                            <button class="file-btn" data-folder="${t.folder}" data-file="${f}" onclick="loadFile('${t.folder}', '${f}')">${f.replace('.cpp', '').replace(/_/g, ' ')}</button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
        
        // Toggle topic
        function toggleTopic(id) {
            document.querySelector(`[data-id="${id}"]`).classList.toggle('open');
        }
        
        // Show state
        function showState(state) {
            emptyState.style.display = state === 'empty' ? 'flex' : 'none';
            loading.classList.toggle('visible', state === 'loading');
            codeView.classList.toggle('visible', state === 'code');
        }
        
        // Load file
        async function loadFile(folder, file) {
            // Update active state
            if (activeBtn) activeBtn.classList.remove('active');
            activeBtn = document.querySelector(`[data-folder="${folder}"][data-file="${file}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            
            // Close mobile menu
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
            
            showState('loading');
            
            try {
                const url = `${GITHUB_RAW}/${encodeURIComponent(folder)}/${file}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                
                currentCode = await res.text();
                
                fileName.textContent = `${folder.split('. ')[1]}/${file}`;
                ghBtn.href = `${GITHUB_BLOB}/${encodeURIComponent(folder)}/${file}`;
                
                code.textContent = currentCode;
                Prism.highlightElement(code);
                
                showState('code');
            } catch {
                showState('empty');
            }
        }
        
        // Copy code
        copyBtn.onclick = async () => {
            if (!currentCode) return;
            await navigator.clipboard.writeText(currentCode);
            copyBtn.textContent = '✓ Copied';
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.textContent = '📋 Copy';
                copyBtn.classList.remove('copied');
            }, 2000);
        };
        
        // Mobile menu
        menuBtn.onclick = () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('visible');
        };
        
        overlay.onclick = () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
        };
        
        // Init
        buildNav();
        showState('empty');
    </script>
</body>
</html>
