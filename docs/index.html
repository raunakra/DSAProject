<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Interview Prep</title>
    
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --bg-tertiary: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #27272a;
            --sidebar-width: 280px;
            --header-height: 56px;
        }
        
        /* Light theme */
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f4f4f5;
            --bg-tertiary: #e4e4e7;
            --text-primary: #18181b;
            --text-secondary: #52525b;
            --text-muted: #a1a1aa;
            --border: #e4e4e7;
        }
        
        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        /* Layout */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 1rem;
            flex-shrink: 0;
        }
        
        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.25rem;
        }
        
        .logo {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .logo-icon {
            color: var(--accent);
        }
        
        .header-spacer {
            flex: 1;
        }
        
        .github-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            transition: all 0.15s;
        }
        
        .github-link:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }
        
        .theme-selector {
            position: relative;
        }
        
        .theme-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        
        .theme-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }
        
        .theme-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            min-width: 160px;
            display: none;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        
        .theme-dropdown.open {
            display: block;
        }
        
        .theme-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: none;
            border: none;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }
        
        .theme-option:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .theme-option.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
        }
        
        .theme-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        /* Main Content */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }
        
        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .sidebar-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        /* Topic */
        .topic {
            margin-bottom: 0.25rem;
        }
        
        .topic-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: none;
            border: none;
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }
        
        .topic-btn:hover {
            background: var(--bg-tertiary);
        }
        
        .topic-icon {
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }
        
        .topic-name {
            flex: 1;
        }
        
        .topic-chevron {
            color: var(--text-muted);
            font-size: 0.625rem;
            transition: transform 0.2s;
        }
        
        .topic.open .topic-chevron {
            transform: rotate(90deg);
        }
        
        .topic-files {
            display: none;
            padding: 0.25rem 0 0.25rem 1.75rem;
        }
        
        .topic.open .topic-files {
            display: block;
        }
        
        .file-btn {
            width: 100%;
            display: block;
            padding: 0.375rem 0.75rem;
            background: none;
            border: none;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .file-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }
        
        .file-btn.active {
            color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }
        
        /* Content Area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 0.9375rem;
        }
        
        /* Code View */
        .code-view {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        
        .code-view.visible {
            display: flex;
        }
        
        .code-toolbar {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            gap: 0.75rem;
        }
        
        .file-path {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }
        
        .file-path span {
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .toolbar-spacer {
            flex: 1;
        }
        
        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.375rem 0.625rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }
        
        .toolbar-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }
        
        .toolbar-btn.copied {
            color: #22c55e;
            border-color: #22c55e;
        }
        
        .code-wrapper {
            flex: 1;
            overflow: auto;
            padding: 1rem;
        }
        
        .code-wrapper::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        .code-wrapper::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
        .code-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        .code-wrapper pre {
            margin: 0;
            border-radius: 8px;
            background: var(--bg-secondary) !important;
        }
        
        .code-wrapper code {
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.875rem !important;
            line-height: 1.6 !important;
        }
        
        /* Loading */
        .loading {
            flex: 1;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .loading.visible {
            display: flex;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Footer */
        .footer {
            padding: 0.75rem 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
        }
        
        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        
        .footer a:hover {
            color: var(--text-primary);
        }
        
        /* Mobile */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 40;
        }
        
        .overlay.visible {
            display: block;
        }
        
        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }
            
            .sidebar {
                position: fixed;
                top: var(--header-height);
                left: 0;
                bottom: 0;
                z-index: 50;
                transform: translateX(-100%);
                transition: transform 0.2s ease;
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .github-link span {
                display: none;
            }
        }
        
        /* Prism overrides */
        .line-numbers .line-numbers-rows {
            border-right: 1px solid var(--border) !important;
        }
        
        .line-numbers-rows > span:before {
            color: var(--text-muted) !important;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="menu-btn" id="menuBtn">☰</button>
            <div class="logo">
                <span class="logo-icon">◆</span>
                <span>DSA Interview Prep</span>
            </div>
            <div class="header-spacer"></div>
            <div class="theme-selector">
                <button class="theme-btn" id="themeBtn">🎨 <span id="themeName">One Dark</span> ▾</button>
                <div class="theme-dropdown" id="themeDropdown">
                    <button class="theme-option active" data-theme="one-dark">
                        <span class="theme-dot" style="background: #282c34"></span> One Dark
                    </button>
                    <button class="theme-option" data-theme="monokai">
                        <span class="theme-dot" style="background: #272822"></span> Monokai
                    </button>
                    <button class="theme-option" data-theme="dracula">
                        <span class="theme-dot" style="background: #282a36"></span> Dracula
                    </button>
                    <button class="theme-option" data-theme="nord">
                        <span class="theme-dot" style="background: #2e3440"></span> Nord
                    </button>
                    <button class="theme-option" data-theme="solarized-dark">
                        <span class="theme-dot" style="background: #002b36"></span> Solarized Dark
                    </button>
                    <button class="theme-option" data-theme="github-light">
                        <span class="theme-dot" style="background: #ffffff; border: 1px solid #ddd"></span> GitHub Light
                    </button>
                    <button class="theme-option" data-theme="vs-light">
                        <span class="theme-dot" style="background: #f3f3f3; border: 1px solid #ddd"></span> VS Light
                    </button>
                </div>
            </div>
            <a href="https://github.com/raunakra/DSAProject" target="_blank" class="github-link">
                <span>GitHub</span> ↗
            </a>
        </header>
        
        <!-- Overlay -->
        <div class="overlay" id="overlay"></div>
        
        <!-- Main -->
        <div class="main">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <nav class="sidebar-content" id="nav"></nav>
            </aside>
            
            <!-- Content -->
            <main class="content">
                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📂</div>
                    <p class="empty-text">Select a file from the sidebar</p>
                </div>
                
                <!-- Loading -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
                
                <!-- Code View -->
                <div class="code-view" id="codeView">
                    <div class="code-toolbar">
                        <div class="file-path">
                            <span id="fileName">file.cpp</span>
                        </div>
                        <div class="toolbar-spacer"></div>
                        <button class="toolbar-btn" id="copyBtn">📋 Copy</button>
                        <a href="#" class="toolbar-btn" id="ghBtn" target="_blank">↗ View on GitHub</a>
                    </div>
                    <div class="code-wrapper">
                        <pre class="line-numbers"><code class="language-cpp" id="code"></code></pre>
                    </div>
                </div>
            </main>
        </div>
        
        <!-- Footer -->
        <footer class="footer">
            <a href="https://github.com/raunakra/DSAProject">DSAProject</a> · 110+ Interview Problems · C++17
        </footer>
    </div>
    
    <!-- Prism.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    
    <!-- Enhanced C++ syntax highlighting - Multiple Themes -->
    <style>
        /* ============ ONE DARK (Default) ============ */
        [data-editor-theme="one-dark"] .code-wrapper pre { background: #282c34 !important; }
        [data-editor-theme="one-dark"] .token.keyword { color: #c678dd !important; }
        [data-editor-theme="one-dark"] .token.class-name,
        [data-editor-theme="one-dark"] .token.builtin { color: #e5c07b !important; }
        [data-editor-theme="one-dark"] .token.function { color: #61afef !important; }
        [data-editor-theme="one-dark"] .token.string { color: #98c379 !important; }
        [data-editor-theme="one-dark"] .token.number { color: #d19a66 !important; }
        [data-editor-theme="one-dark"] .token.comment { color: #5c6370 !important; font-style: italic; }
        [data-editor-theme="one-dark"] .token.operator { color: #56b6c2 !important; }
        [data-editor-theme="one-dark"] .token.punctuation { color: #abb2bf !important; }
        [data-editor-theme="one-dark"] .token.directive,
        [data-editor-theme="one-dark"] .token.macro { color: #c678dd !important; }
        [data-editor-theme="one-dark"] .line-numbers-rows > span:before { color: #495162 !important; }
        [data-editor-theme="one-dark"] .line-numbers .line-numbers-rows { border-right-color: #3b4048 !important; }
        
        /* ============ MONOKAI ============ */
        [data-editor-theme="monokai"] .code-wrapper pre { background: #272822 !important; }
        [data-editor-theme="monokai"] .token.keyword { color: #f92672 !important; }
        [data-editor-theme="monokai"] .token.class-name,
        [data-editor-theme="monokai"] .token.builtin { color: #66d9ef !important; font-style: italic; }
        [data-editor-theme="monokai"] .token.function { color: #a6e22e !important; }
        [data-editor-theme="monokai"] .token.string { color: #e6db74 !important; }
        [data-editor-theme="monokai"] .token.number { color: #ae81ff !important; }
        [data-editor-theme="monokai"] .token.comment { color: #75715e !important; font-style: italic; }
        [data-editor-theme="monokai"] .token.operator { color: #f92672 !important; }
        [data-editor-theme="monokai"] .token.punctuation { color: #f8f8f2 !important; }
        [data-editor-theme="monokai"] .token.directive,
        [data-editor-theme="monokai"] .token.macro { color: #f92672 !important; }
        [data-editor-theme="monokai"] .line-numbers-rows > span:before { color: #90908a !important; }
        [data-editor-theme="monokai"] .line-numbers .line-numbers-rows { border-right-color: #3e3d32 !important; }
        
        /* ============ DRACULA ============ */
        [data-editor-theme="dracula"] .code-wrapper pre { background: #282a36 !important; }
        [data-editor-theme="dracula"] .token.keyword { color: #ff79c6 !important; }
        [data-editor-theme="dracula"] .token.class-name,
        [data-editor-theme="dracula"] .token.builtin { color: #8be9fd !important; font-style: italic; }
        [data-editor-theme="dracula"] .token.function { color: #50fa7b !important; }
        [data-editor-theme="dracula"] .token.string { color: #f1fa8c !important; }
        [data-editor-theme="dracula"] .token.number { color: #bd93f9 !important; }
        [data-editor-theme="dracula"] .token.comment { color: #6272a4 !important; font-style: italic; }
        [data-editor-theme="dracula"] .token.operator { color: #ff79c6 !important; }
        [data-editor-theme="dracula"] .token.punctuation { color: #f8f8f2 !important; }
        [data-editor-theme="dracula"] .token.directive,
        [data-editor-theme="dracula"] .token.macro { color: #ff79c6 !important; }
        [data-editor-theme="dracula"] .line-numbers-rows > span:before { color: #6272a4 !important; }
        [data-editor-theme="dracula"] .line-numbers .line-numbers-rows { border-right-color: #44475a !important; }
        
        /* ============ NORD ============ */
        [data-editor-theme="nord"] .code-wrapper pre { background: #2e3440 !important; }
        [data-editor-theme="nord"] .token.keyword { color: #81a1c1 !important; }
        [data-editor-theme="nord"] .token.class-name,
        [data-editor-theme="nord"] .token.builtin { color: #8fbcbb !important; }
        [data-editor-theme="nord"] .token.function { color: #88c0d0 !important; }

        [data-editor-theme="nord"] .token.number { color: #b48ead !important; }
        [data-editor-theme="nord"] .token.comment { color: #616e88 !important; font-style: italic; }

        [data-editor-theme="nord"] .token.punctuation { color: #eceff4 !important; }
        [data-editor-theme="nord"] .token.directive,
        [data-editor-theme="nord"] .token.macro { color: #5e81ac !important; }
        [data-editor-theme="nord"] .line-numbers-rows > span:before { color: #4c566a !important; }
        [data-editor-theme="nord"] .line-numbers .line-numbers-rows { border-right-color: #3b4252 !important; }
        
        /* ============ SOLARIZED DARK ============ */
        [data-editor-theme="solarized-dark"] .code-wrapper pre { background: #002b36 !important; }
        [data-editor-theme="solarized-dark"] .token.keyword { color: #859900 !important; }
        [data-editor-theme="solarized-dark"] .token.class-name,
        [data-editor-theme="solarized-dark"] .token.builtin { color: #b58900 !important; }

        [data-editor-theme="solarized-dark"] .token.macro { color: #cb4b16 !important; }
        [data-editor-theme="solarized-dark"] .line-numbers-rows > span:before { color: #586e75 !important; }
        [data-editor-theme="solarized-dark"] .line-numbers .line-numbers-rows { border-right-color: #073642 !important; }
        
        /* ============ GITHUB LIGHT ============ */
        [data-editor-theme="github-light"] .code-wrapper pre { background: #ffffff !important; }
        [data-editor-theme="github-light"] .token.keyword { color: #d73a49 !important; }
        [data-editor-theme="github-light"] .token.class-name,
        [data-editor-theme="github-light"] .token.builtin { color: #6f42c1 !important; }
        [data-editor-theme="github-light"] .token.function { color: #6f42c1 !important; }
        [data-editor-theme="github-light"] .token.string { color: #032f62 !important; }
        [data-editor-theme="github-light"] .token.number { color: #005cc5 !important; }
        [data-editor-theme="github-light"] .token.comment { color: #6a737d !important; font-style: italic; }
        [data-editor-theme="github-light"] .token.operator { color: #d73a49 !important; }
        [data-editor-theme="github-light"] .token.punctuation { color: #24292e !important; }
        [data-editor-theme="github-light"] .token.directive,
        [data-editor-theme="github-light"] .token.macro { color: #22863a !important; }
        [data-editor-theme="github-light"] .line-numbers-rows > span:before { color: #6e7781 !important; }
        [data-editor-theme="github-light"] .line-numbers .line-numbers-rows { border-right-color: #d0d7de !important; }
        
        /* ============ VS LIGHT ============ */
        [data-editor-theme="vs-light"] .code-wrapper pre { background: #f3f3f3 !important; }
        [data-editor-theme="vs-light"] .token.keyword { color: #0000ff !important; }
        [data-editor-theme="vs-light"] .token.class-name,
        [data-editor-theme="vs-light"] .token.builtin { color: #267f99 !important; }
        [data-editor-theme="vs-light"] .token.function { color: #795e26 !important; }
        [data-editor-theme="vs-light"] .token.string { color: #a31515 !important; }
        [data-editor-theme="vs-light"] .token.number { color: #098658 !important; }
        [data-editor-theme="vs-light"] .token.comment { color: #008000 !important; font-style: italic; }
        [data-editor-theme="vs-light"] .token.operator { color: #000000 !important; }
        [data-editor-theme="vs-light"] .token.punctuation { color: #000000 !important; }
        [data-editor-theme="vs-light"] .token.directive,
        [data-editor-theme="vs-light"] .token.macro { color: #0000ff !important; }
        [data-editor-theme="vs-light"] .line-numbers-rows > span:before { color: #237893 !important; }
        [data-editor-theme="vs-light"] .line-numbers .line-numbers-rows { border-right-color: #c8c8c8 !important; }
    </style>
    
    <script>
        const topics = [
            { id: 1, name: "Arrays & Strings", icon: "📊", folder: "1. Arrays_Strings", files: [
                "Two_Pointers.cpp", "Sliding_Window.cpp", "Prefix_Sum.cpp", "String_Manipulation.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 2, name: "Linked Lists", icon: "🔗", folder: "2. Linked_Lists", files: [
                "Reversal.cpp", "Fast_Slow_Pointers.cpp", "Dummy_Node.cpp", "Cycle_Detection.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 3, name: "Stacks & Queues", icon: "📚", folder: "3. Stacks_Queues", files: [
                "Monotonic_Stack.cpp", "Expression_Evaluation.cpp", "Queue_BFS.cpp", "Deque_Sliding_Window.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 4, name: "Trees", icon: "🌳", folder: "4. Trees", files: [
                "Traversals.cpp", "Recursion.cpp", "Properties.cpp", "LCA.cpp", "Diameter.cpp", "Construction.cpp", "Morris_Inorder.cpp", "Boundary_Traversal.cpp", "Left_Right_View.cpp", "Top_View.cpp", "Bottom_View.cpp", "Vertical_Order_Traversal.cpp", "Maximum_Width.cpp", "Children_Sum_Property.cpp", "Time_To_Burn_Tree.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 5, name: "Binary Search Trees", icon: "🔍", folder: "5. Binary_Search_Trees", files: [
                "Validation.cpp", "Operations.cpp", "Successor_Predecessor.cpp", "BST_to_Sorted_Array.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 6, name: "Heaps & Priority Queues", icon: "⬆️", folder: "6. Heaps_Priority_Queue", files: [
                "Top_K.cpp", "Merge_K_Sorted.cpp", "Meeting_Rooms.cpp", "Running_Median.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 7, name: "Graphs", icon: "🕸️", folder: "7. Graphs", files: [
                "BFS_DFS.cpp", "Grid_BFS.cpp", "Grid_DFS.cpp", "Cycle_Detection.cpp", "Topological_Sort.cpp", "Kosaraju_SCC.cpp", "Word_Ladder.cpp", "Dijkstra.cpp", "Union_Find.cpp", "MST_Kruskal.cpp", "Rotten_Oranges.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 8, name: "Dynamic Programming", icon: "🧩", folder: "8. Dynamic_Programming", files: [
                "1D_DP.cpp", "2D_DP.cpp", "Knapsack.cpp", "LCS_LIS.cpp", "String_DP.cpp", "DP_On_Trees.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 9, name: "Binary Search", icon: "🎯", folder: "9. Binary_Search", files: [
                "Standard_BS.cpp", "Rotated_Array.cpp", "BS_on_Answer.cpp", "Peak_Element.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 10, name: "Backtracking", icon: "🔄", folder: "10. Backtracking", files: [
                "Subsets_Permutations.cpp", "N_Queens.cpp", "Palindrome_Partitioning.cpp", "Amazon_Salesforce_Questions.cpp"
            ]},
            { id: 11, name: "Bit Manipulation", icon: "💻", folder: "11. Bit_Manipulation", files: [
                "Basic_Operations.cpp", "Tricks.cpp", "Single_Number.cpp", "Amazon_Salesforce_Questions.cpp"
            ]}
        ];
        
        const GITHUB_RAW = "https://raw.githubusercontent.com/raunakra/DSAProject/main";
        const GITHUB_BLOB = "https://github.com/raunakra/DSAProject/blob/main";
        
        const nav = document.getElementById('nav');
        const emptyState = document.getElementById('emptyState');
        const loading = document.getElementById('loading');
        const codeView = document.getElementById('codeView');
        const code = document.getElementById('code');
        const fileName = document.getElementById('fileName');
        const copyBtn = document.getElementById('copyBtn');
        const ghBtn = document.getElementById('ghBtn');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        
        let currentCode = '';
        let activeBtn = null;
        
        // Build navigation
        function buildNav() {
            nav.innerHTML = topics.map(t => `
                <div class="topic" data-id="${t.id}">
                    <button class="topic-btn" onclick="toggleTopic(${t.id})">
                        <span class="topic-icon">${t.icon}</span>
                        <span class="topic-name">${t.name}</span>
                        <span class="topic-chevron">▶</span>
                    </button>
                    <div class="topic-files">
                        ${t.files.map(f => `
                            <button class="file-btn" data-folder="${t.folder}" data-file="${f}" onclick="loadFile('${t.folder}', '${f}')">${f.replace('.cpp', '').replace(/_/g, ' ')}</button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
        
        // Toggle topic
        function toggleTopic(id) {
            document.querySelector(`[data-id="${id}"]`).classList.toggle('open');
        }
        
        // Show state
        function showState(state) {
            emptyState.style.display = state === 'empty' ? 'flex' : 'none';
            loading.classList.toggle('visible', state === 'loading');
            codeView.classList.toggle('visible', state === 'code');
        }
        
        // Load file
        async function loadFile(folder, file) {
            // Update active state
            if (activeBtn) activeBtn.classList.remove('active');
            activeBtn = document.querySelector(`[data-folder="${folder}"][data-file="${file}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            
            // Close mobile menu
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
            
            showState('loading');
            
            try {
                const url = `${GITHUB_RAW}/${encodeURIComponent(folder)}/${file}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                
                currentCode = await res.text();
                
                fileName.textContent = `${folder.split('. ')[1]}/${file}`;
                ghBtn.href = `${GITHUB_BLOB}/${encodeURIComponent(folder)}/${file}`;
                
                code.textContent = currentCode;
                Prism.highlightElement(code);
                
                showState('code');
            } catch {
                showState('empty');
            }
        }
        
        // Copy code
        copyBtn.onclick = async () => {
            if (!currentCode) return;
            await navigator.clipboard.writeText(currentCode);
            copyBtn.textContent = '✓ Copied';
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.textContent = '📋 Copy';
                copyBtn.classList.remove('copied');
            }, 2000);
        };
        
        // Mobile menu
        menuBtn.onclick = () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('visible');
        };
        
        overlay.onclick = () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
        };
        
        // Editor Theme Selector
        const themeBtn = document.getElementById('themeBtn');
        const themeDropdown = document.getElementById('themeDropdown');
        const themeName = document.getElementById('themeName');
        const themeOptions = document.querySelectorAll('.theme-option');
        const html = document.documentElement;
        
        const themeNames = {
            'one-dark': 'One Dark',
            'monokai': 'Monokai',
            'dracula': 'Dracula',
            'nord': 'Nord',
            'solarized-dark': 'Solarized Dark',
            'github-light': 'GitHub Light',
            'vs-light': 'VS Light'
        };
        
        function setEditorTheme(theme) {
            html.setAttribute('data-editor-theme', theme);
            themeName.textContent = themeNames[theme] || theme;
            localStorage.setItem('editorTheme', theme);
            
            // Update active state
            themeOptions.forEach(opt => {
                opt.classList.toggle('active', opt.dataset.theme === theme);
            });
            
            // Close dropdown
            themeDropdown.classList.remove('open');
        }
        
        // Toggle dropdown
        themeBtn.onclick = (e) => {
            e.stopPropagation();
            themeDropdown.classList.toggle('open');
        };
        
        // Theme option click
        themeOptions.forEach(opt => {
            opt.onclick = () => setEditorTheme(opt.dataset.theme);
        });
        
        // Close dropdown on outside click
        document.addEventListener('click', () => {
            themeDropdown.classList.remove('open');
        });
        
        // Load saved theme or default
        const savedTheme = localStorage.getItem('editorTheme') || 'one-dark';
        setEditorTheme(savedTheme);
        
        // Init
        buildNav();
        showState('empty');
    </script>
</body>
</html>
